name: maintenance
on:
  pull_request:
    paths: ['hush', 'helpers/**', 'test/**', 'package.json', '.github/workflows/maintenance.yml']
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: install isolated Linux keyring prerequisites
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - name: complete suite in a disposable keyring session
        shell: bash
        run: |
          dbus-run-session -- bash -c "echo '' | gnome-keyring-daemon --unlock --components=secrets >/dev/null 2>&1; ./test/test.sh"
